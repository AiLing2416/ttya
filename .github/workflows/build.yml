name: Build

on:
  push:
    branches: [ main ]
    tags: [ v* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [amd64, arm64, armv7, win32]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Build Frontend
      run: |
        cd html
        corepack enable
        corepack yarn install
        corepack yarn run build
        corepack yarn run gulp

    - name: Build Binary
      run: |
        docker run --rm -v $(pwd):/src -w /src \
          -e BUILD_TARGET=${{ matrix.target }} \
          tsl0922/musl-cross ./scripts/cross-build.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ttya-${{ matrix.target }}
        path: dist/${{ matrix.target }}/ttya*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
